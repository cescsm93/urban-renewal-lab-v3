<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

 <title>城市更新工作台 · 公开演示</title>
<style>
:root {
  --bg:#f1f3ee; --surface:#fff; --fg:#1b2a23; --muted:#52645a;
  --border:#dce4dc; --accent:#194f3d; --accent-soft:#e6efe8;
  --map:#eaf0ea; --water:#e5eff0; --project:#208065; --parcel:#667d95;
  --building:#936c49; --plan:#8b698e; --warn:#795222; --warn-bg:#fbf3e3;
  --selected:#003c2c; --neighbor:#246a91; --shadow:0 6px 23px rgba(25,53,42,.10);
  --font-body:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --font-mono:Consolas,monospace; --radius:9px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font-body);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--neighbor);outline-offset:2px}
button,a{-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1{font-size:25px;line-height:1.3;letter-spacing:-.045em}
h2{font-size:23px;line-height:1.3;letter-spacing:-.04em}
h3{font-size:14px}
small,.muted{color:var(--muted)}
small{font-size:12px}
svg{display:block}
.icon{width:17px;height:17px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{background:var(--selected)}
.btn.selected{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 33%,var(--border));color:var(--accent)}
.btn.icon-btn{width:35px;padding:0;min-height:33px}
.btn.link{background:transparent;border-color:transparent;padding-inline:5px;color:var(--accent)}
.shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:55px 62px minmax(0,1fr) 29px}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:0 23px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand,.brand-mark,.top-actions,.crumbs,.row,.chips,.actions,.pane-title,.tabs{display:flex;align-items:center;gap:8px}
.brand{gap:11px;font-weight:750;letter-spacing:-.02em}
.brand-mark{width:33px;height:33px;justify-content:center;background:var(--accent);color:var(--surface);border-radius:9px}
.brand-mark svg{width:20px;height:20px}
.brand small{font-size:11px;font-weight:500;margin-left:7px;letter-spacing:0}
.prototype-tag{border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--muted)}
.workspace-head{display:flex;justify-content:space-between;align-items:center;padding:0 23px;background:var(--surface);border-bottom:1px solid var(--border);gap:14px}
.crumbs{gap:7px;color:var(--muted);flex-wrap:wrap}
.crumbs button{padding:3px 5px;background:transparent;border:0;color:var(--accent);font-weight:650}
.crumbs strong{color:var(--fg);padding-inline:3px}
.workspace-label{font-size:12px;color:var(--muted)}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px}
.map-frame{min-height:0;min-width:0;position:relative;overflow:hidden;background:var(--map);isolation:isolate}
.map-frame svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.map-tools,.map-controls,.legend,.locator,.scale,.layer-pop{position:absolute;z-index:2}
.map-tools{top:14px;left:15px;display:flex;gap:7px;max-width:calc(100% - 30px);flex-wrap:wrap}
.map-tools .btn,.map-controls,.legend,.layer-pop,.scale,.locator{box-shadow:var(--shadow)}
.map-controls{right:15px;bottom:48px;display:grid;background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.map-controls button{width:35px;height:35px;padding:0;border:0;border-bottom:1px solid var(--border);border-radius:0}
.map-controls button:last-child{border-bottom:0}
.layer-pop{top:55px;left:15px;width:228px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.layer-pop[hidden],.drawer[hidden],.toast[hidden],.locator[hidden]{display:none}
.layer-pop label{display:flex;align-items:center;gap:7px;padding:5px 1px}
.layer-pop label small{margin-left:auto}
.layer-pop hr{border:0;border-top:1px solid var(--border);margin:7px 0}
.legend{bottom:17px;left:15px;padding:8px 11px;background:var(--surface);border-radius:8px;max-width:calc(100% - 72px)}
.legend-items{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend-items span{display:flex;align-items:center;gap:5px}
.swatch{--sw:var(--project);width:11px;height:9px;border:1.5px solid var(--sw);background:color-mix(in srgb,var(--sw) 20%,transparent);border-radius:2px;flex:none}
.parcel{--sw:var(--parcel)}.building{--sw:var(--building)}.plan{--sw:var(--plan)}.extent{--sw:var(--accent);border-style:dashed}.neighbor{--sw:var(--neighbor);border-style:dashed}
.locator{right:15px;top:14px;max-width:210px;padding:5px 9px;border-radius:6px;background:var(--surface);color:var(--muted);font-size:11px}
.scale{right:15px;bottom:16px;background:var(--surface);color:var(--muted);padding:3px 7px;border-radius:4px;font-size:10px}
.scale::after{content:"";display:block;height:3px;border:1px solid var(--muted);border-top:0}
.inspector{min-width:0;min-height:0;overflow:auto;border-left:1px solid var(--border);background:var(--surface)}
.panel-head,.panel-block{padding:18px 19px;border-bottom:1px solid var(--border)}
.panel-head{padding-top:19px;padding-bottom:17px}
.panel-head .kicker{color:var(--accent);font-size:11px;font-weight:700;margin-bottom:4px}
.panel-head p{margin-top:7px;line-height:1.6;color:var(--muted);font-size:12px}
.panel-block h3{margin-bottom:8px}
.project-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.metric{padding:9px 11px;background:var(--bg);border-radius:7px;min-width:0}
.metric small{display:block;white-space:nowrap}
.metric strong{font:700 24px/1.25 var(--font-mono);display:block;margin:3px 0}
.metric .muted{font-size:11px}
.panel-list{display:grid;gap:4px}
.list-item{width:100%;display:flex;align-items:center;gap:8px;min-height:37px;text-align:left;padding:6px 8px;border:1px solid transparent;background:transparent;border-radius:7px}
.list-item:hover,.list-item.active{background:var(--accent-soft);border-color:var(--border)}
.list-item>span:first-child{flex:1}
.list-item .leader{display:block;height:3px;background:var(--project);width:100%;max-width:57px;border-radius:4px}
.list-item small{white-space:nowrap}
.list-item small.num{font:600 12px var(--font-mono)}
.list-item .arrow{color:var(--accent);font-size:16px}
.list-title{display:flex;align-items:center;justify-content:space-between;gap:6px}
.data-note{font-size:11px;color:var(--muted);line-height:1.6}
.entry-card{padding:11px;border:1px solid var(--border);border-radius:8px;margin-top:6px}
.entry-card p{font-size:12px;margin-top:4px;color:var(--muted)}
.compact-select{border:1px solid var(--border);border-radius:6px;padding:5px 7px;background:var(--surface);max-width:100%}
.key-values{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.key-values div{background:var(--bg);padding:7px 9px;border-radius:6px}
.key-values dt{font-size:11px;color:var(--muted)}
.key-values dd{font-size:12px;margin:1px 0 0;overflow-wrap:anywhere}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rel-grid button{justify-content:space-between;min-width:0;font-size:12px}
.chips{gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--bg);border-radius:4px;padding:2px 6px;font-size:11px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:6px;font-size:12px}
.status{display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--muted);gap:10px}
.status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area-outline{fill:color-mix(in srgb,var(--accent) 5%,transparent);stroke:var(--accent);stroke-opacity:.65;stroke-width:1.4;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.admin-shape,.feature{cursor:pointer;vector-effect:non-scaling-stroke;stroke-linejoin:round;fill-rule:evenodd}
.admin-shape{fill:var(--bg);stroke:color-mix(in srgb,var(--accent) 34%,var(--border));stroke-width:1.25}
.admin-shape.available{fill:color-mix(in srgb,var(--project) 17%,var(--surface));stroke:var(--project);stroke-width:1.7}
.admin-shape:hover,.admin-shape.focused{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.admin-label,.place-label,.project-label,.scope-label{pointer-events:none;text-anchor:middle;font-family:var(--font-body);font-weight:650;paint-order:stroke;stroke:var(--bg);stroke-width:3.6px;stroke-linejoin:round;fill:var(--fg);font-size:13px}
.admin-label.available{fill:var(--accent);font-size:15px}
.place-label{font-size:11px;font-weight:500;fill:var(--muted)}
.feature{fill:color-mix(in srgb,var(--sw) 26%,transparent);stroke:var(--sw);stroke-width:.7}
.feature.parcel{fill:color-mix(in srgb,var(--sw) 5%,transparent);stroke-opacity:.63}
.feature.building{fill:color-mix(in srgb,var(--sw) 13%,transparent);stroke-opacity:.60;stroke-width:.55}
.feature.plan{fill:color-mix(in srgb,var(--sw) 12%,transparent);stroke-opacity:.73;stroke-dasharray:3 2}
.feature.project{--sw:var(--project);fill:color-mix(in srgb,var(--sw) 35%,transparent);stroke-width:1.4}
.feature.is-active:hover{stroke-width:2.8;fill:color-mix(in srgb,var(--sw) 48%,transparent)}
.feature.is-related{stroke-opacity:1;stroke-width:1.45}
.feature.is-chosen{fill:color-mix(in srgb,var(--sw) 53%,transparent);stroke:var(--selected);stroke-width:2.8;stroke-dasharray:none;stroke-opacity:1}
.project-label{font-size:12px;fill:var(--selected);stroke-width:3.4px}
.pin-group{cursor:pointer}
.pin-group rect,.pin-group circle{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
.pin-group text{pointer-events:none;fill:var(--surface);font-family:var(--font-body);font-size:12px;font-weight:650;text-anchor:middle}
.scope-ring{fill:color-mix(in srgb,var(--neighbor) 12%,transparent);stroke:var(--neighbor);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.scope-label{fill:var(--neighbor);font-size:12px}
.sample-marker{fill:var(--surface);stroke:var(--neighbor);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.drawer{position:fixed;z-index:6;inset:auto 15px 42px;height:min(39vh,410px);min-height:275px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:0 14px 60px rgba(22,49,38,.24);overflow:hidden}
.drawer.max{inset:67px 16px 42px;height:auto}
.drawer-head{padding:10px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.drawer-head h2{font-size:17px;margin-right:4px}
.drawer-tools{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;gap:7px;border-bottom:1px solid var(--border)}
.drawer-tools .btn{min-height:32px;font-size:12px}
.table-scroll{overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}
th,td{max-width:270px;min-width:116px;padding:7px 10px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
thead th{position:sticky;top:0;z-index:2;color:var(--muted);background:var(--bg);font-weight:650}
tbody td:first-child,thead th:first-child{position:sticky;left:0;z-index:1;min-width:134px;background:var(--surface)}
thead th:first-child{z-index:3;background:var(--bg)}
tbody tr.selected td{background:var(--accent-soft)}
tbody tr:hover:not(.selected) td{background:var(--bg)}
.id-button{padding:1px 0;border:0;background:transparent;color:var(--accent);font:650 12px var(--font-mono)}
td input{min-width:120px;max-width:245px;padding:4px 6px;border:1px solid var(--accent);border-radius:4px;background:var(--surface)}
.drawer-foot{padding:5px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:32px}
.toast{position:fixed;z-index:8;bottom:41px;left:50%;transform:translateX(-50%);padding:7px 14px;background:var(--selected);color:var(--surface);border-radius:7px;box-shadow:var(--shadow)}
.toast.on-table{bottom:auto;top:10px}
dialog{width:min(440px,calc(100vw - 30px));border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--shadow);color:var(--fg)}
dialog::backdrop{background:rgba(22,49,38,.34)}
dialog p{margin:7px 0 15px;color:var(--muted)}
dialog .actions{justify-content:flex-end}
@media(max-width:1100px){.workspace{grid-template-columns:minmax(0,1fr) 326px}.panel-head,.panel-block{padding-inline:13px}}
@media(max-width:760px){body{overflow:auto}.shell{height:auto;min-height:100%;grid-template-rows:48px auto auto auto}.workspace-head,.topnav{padding-inline:12px}.workspace-head{padding-block:8px}.workspace{display:flex;flex-direction:column}.map-frame{height:56vh;min-height:360px}.inspector{border-left:0;border-top:1px solid var(--border)}.brand small,.workspace-label,.locator,.drawer-head small{display:none}.drawer{inset:auto 6px 9px;height:48vh}.drawer.max{inset:53px 6px 9px}.drawer-tools{flex-wrap:wrap}.legend-items{gap:5px 9px}.status{height:27px}.panel-head{padding-top:13px}}
:root{
 --bg:#f2f7f8;--surface:#fff;--fg:#17343d;--muted:#506e77;--border:#d4e4e7;

.module-nav,.nav-group{display:flex;align-items:center;gap:5px}
.module-nav{min-height:46px}
.nav-group+.nav-group{padding-left:8px;margin-left:6px;border-left:1px solid var(--border)}
.nav-label{display:none}
.module-button{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;border-radius:7px;background:transparent;padding:8px 10px;min-height:36px;color:var(--muted);font-weight:650}
.module-button:hover,.module-button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}

body{font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}
.shell{min-height:0}
.topnav{height:100%;position:relative;isolation:isolate;justify-content:center;overflow:hidden;padding-inline:16px;background:linear-gradient(180deg,var(--mast-glow),var(--screen-top) 45%, transparent 97%);border:0}
.topnav .brand{position:relative;z-index:2;font-size:clamp(20px,2.02vw,39px);font-weight:900;letter-spacing:.16em;color:#fff;text-shadow:0 2px 4px #062359;margin-top:-.14em}
.topnav .brand-mark{display:none}
.topnav .top-actions{position:absolute;right:15px;top:5px;z-index:3;font-size:10px;gap:5px}
.topnav .top-actions .btn{min-height:24px;padding:1px 6px;background:color-mix(in srgb,var(--screen-top) 91%,transparent);font-size:10px}
.topnav .variant-link{font-size:10px;color:var(--muted)}
.mast-ornament{position:absolute;inset:0;pointer-events:none}
.mast-ornament::before,.mast-ornament::after{content:"";position:absolute;left:0;right:0;top:22%;height:69%;clip-path:polygon(0 23%,26.5% 23%,28.4% 0,71.6% 0,73.5% 23%,100% 23%,100% 65%,93% 65%,91.7% 42%,71.9% 42%,69.4% 100%,30.6% 100%,28.1% 42%,8.3% 42%,7% 65%,0 65%);background:linear-gradient(90deg,var(--edge),var(--mast-glow) 33%,var(--glow) 50%,var(--mast-glow) 67%,var(--edge))}
.mast-ornament::after{top:calc(22% + 4px);height:calc(69% - 7px);opacity:.98;background:linear-gradient(90deg,var(--screen-top) 23%,var(--mast-glow) 38%,var(--side-nav) 50%,var(--mast-glow) 62%,var(--screen-top) 77%)}
.mast-accents{position:absolute;inset:auto 34px 32%;height:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:1}
.mast-accents i{display:block;width:42px;height:8px;background:repeating-linear-gradient(90deg,var(--glow) 0 8px,transparent 8px 16px,var(--mast-glow) 16px 24px,transparent 24px 32px,var(--edge) 32px 40px,transparent 40px 48px)}
.mast-slash{position:absolute;width:39%;height:24%;top:56%;left:30.5%;z-index:1;display:flex;justify-content:space-between;pointer-events:none}
.mast-slash i{display:block;width:46px;background:repeating-linear-gradient(90deg,var(--glow) 0 7px,transparent 7px 12px);transform:skew(39deg);opacity:.82}
.mast-slash i+i{transform:skew(-39deg)}
.board-nav,.board-grid{min-width:0}
body[data-mode=overview] .shell{grid-template-rows:clamp(60px,8.9vh,105px) clamp(62px,10.7vh,122px) minmax(0,1fr) 19px;background:linear-gradient(175deg,var(--screen-top),var(--screen-bottom) 79%,var(--screen-top))}
body[data-mode=overview] #main-nav,body[data-mode=overview] .workspace-head{display:none}
body[data-mode=overview] .workspace{display:block;position:relative}
.board-nav{position:relative;display:grid;grid-template-columns:26.5% minmax(0,1fr) 26.5%;gap:9px;padding:clamp(15px,2.2vh,27px) clamp(15px,1.15vw,24px) 0;z-index:4;align-content:start}
.board-nav .left-nav,.board-nav .right-nav{display:grid;gap:5px}
.board-nav .left-nav{grid-template-columns:repeat(3,minmax(0,1fr))}
.board-nav .right-nav{grid-template-columns:repeat(4,minmax(0,1fr));grid-column:3}
.board-nav button{min-width:0;border:1px solid color-mix(in srgb,var(--side-nav) 76%,var(--edge));height:clamp(33px,4.75vh,52px);padding:3px 2px;background:linear-gradient(var(--side-nav),color-mix(in srgb,var(--side-nav) 35%,var(--screen-top)) 62%,var(--screen-top));box-shadow:inset 0 0 7px #3072ff6a;color:color-mix(in srgb,var(--city-stroke) 88%,#c6faff);font-size:clamp(11px,1vw,18px);font-weight:700;white-space:nowrap}
.board-nav button:hover,.board-nav button[aria-pressed=true]{color:#e0fdff;border-color:var(--glow);box-shadow:inset 0 -1px 8px color-mix(in srgb,var(--glow) 30%,transparent)}
.board-grid{height:100%;width:100%;position:relative;display:grid;grid-template-columns:26.5% minmax(0,1fr) 26.5%;gap:clamp(7px,.9vw,19px);padding:0 clamp(15px,1.15vw,24px) 10px}
.board-left,.board-right{min-height:0;min-width:0;display:grid;gap:clamp(6px,1.2vh,14px)}
.board-left{grid-template-rows:minmax(0,37fr) minmax(0,63fr)}
.board-right{grid-template-rows:minmax(0,37fr) minmax(0,26fr) minmax(0,37fr)}
.board-center{min-width:0;min-height:0;display:grid;grid-template-rows:clamp(67px,10.5vh,110px) minmax(0,1fr);margin-top:calc(-1 * clamp(46px,8.35vh,88px))}
.board-kpis{min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(5px,2.75vw,54px);padding:0 3.5% .6vh;align-items:stretch}
.board-kpi{display:grid;justify-items:center;align-content:center;min-width:0;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--city-fill) 68%,transparent),#0d205f55);border-top:1px solid var(--edge);border-bottom:5px solid #1857a568}
.board-kpi::after{content:"";width:10px;height:2px;position:absolute;right:0;top:-1px;background:var(--glow)}
.board-kpi small{color:color-mix(in srgb,var(--city-stroke) 70%,var(--accent));font-size:clamp(12px,1.6vw,30px);white-space:nowrap;font-weight:500}
.board-kpi strong{font-size:clamp(20px,2.55vw,47px);font-weight:760;line-height:1.11;color:#fafbff;font-variant-numeric:tabular-nums}
.board-kpi strong em{font-style:normal;font-size:.65em;margin-left:.09em}
.board-card{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:clamp(8px,1.15vh,14px) clamp(9px,.85vw,17px);border:1px solid var(--edge);background:color-mix(in srgb,var(--surface) 95%,transparent);box-shadow:inset 0 0 18px #107dff20}
.panel-title{min-width:0;font-size:clamp(12px,1.04vw,19px);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 6px;display:flex;gap:6px;align-items:center}
.panel-title::before{width:9px;height:.95em;flex:none;content:"";background:var(--glow);clip-path:polygon(0 0,60% 0,100% 50%,60% 100%,0 100%)}
.board-chart{position:relative;flex:1;min-height:0;min-width:0;display:grid;align-items:stretch}
.bar-chart{display:grid;grid-template-columns:31px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 28px;margin:5px 1px 0}
.bar-axis{display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding-right:7px;font:10px/1 var(--font-mono);color:var(--muted)}
.bar-grid{position:relative;display:grid;grid-auto-rows:minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--chart-line);background:repeating-linear-gradient(to top,var(--chart-line) 0 1px,transparent 1px 16.66%);gap:0;min-width:0}
.bar-cell{position:relative;display:block;min-width:0;height:100%;padding:0;border:0;background:none}
.bar-cell:hover{background:#7ec9ff22}
.bar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:clamp(3px,48%,14px);height:var(--h);background:linear-gradient(to top,#9acbff45,var(--chart-fill) 38%,var(--chart-fill));box-shadow:0 0 4px #3bb2ff35}
.bar-labels{grid-column:2;display:grid;margin:0;text-align:center;align-content:start;font-size:clamp(8px,.68vw,12px);color:var(--muted);padding-top:3px}
.bar-labels span{max-width:2.1em;line-height:1.3;margin:auto;word-break:break-all}
.horizontal-chart{display:flex;flex-direction:column;justify-content:space-around;gap:5px;min-height:0;padding:3% 0}
.h-row{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3.1em;gap:6px;align-items:center;padding:1px 0;font-size:clamp(9px,.75vw,14px)}
.h-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.h-row strong{color:var(--fg);font:600 12px/1 var(--font-mono);text-align:right}
.h-track{width:100%;height:clamp(7px,1.25vh,14px);border-left:1px solid var(--chart-line);background:repeating-linear-gradient(to right,#64affb22 0 1px,transparent 1px 25%)}
.h-fill{height:100%;width:var(--w);background:linear-gradient(90deg,var(--chart-fill),var(--glow))}
.board-left .h-track{height:clamp(14px,2.3vh,26px)}
.board-left .h-fill{background:linear-gradient(180deg,#235ea9,#163b83);border-radius:0 4px 4px 0;box-shadow:inset 0 0 8px color-mix(in srgb,var(--glow) 31%,transparent)}
.donut-chart{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);align-items:center;min-height:0;gap:10px}
.donut{width:min(95%,160px);aspect-ratio:1;margin:auto;border-radius:50%;position:relative;background:var(--ring);border:3px solid #247eba84;box-shadow:inset 0 0 0 4px var(--surface);display:grid;place-items:center}
.donut::before{position:absolute;inset:19%;content:"";border-radius:50%;background:var(--surface);box-shadow:0 0 0 4px var(--screen-bottom),0 0 0 8px #183f8877}
.donut strong{position:relative;font-size:clamp(14px,1.5vw,27px)}
.donut-key{display:grid;gap:6px;font-size:clamp(9px,.71vw,13px)}
.donut-key div{display:flex;gap:5px;align-items:center;min-width:0}
.donut-key i{width:7px;height:7px;border-radius:50%;background:var(--segment);flex:none}
.donut-key strong{margin-left:auto}
.screen-meta{position:absolute;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:5px 9px;color:var(--muted);font-size:10px;top:6px;left:0;right:0;pointer-events:none}
.screen-meta button{color:inherit;background:#081b42d0;border:1px solid var(--edge);border-radius:2px;padding:2px 5px;pointer-events:auto}
.board-grid .map-frame{background:none;border:0;height:auto}
.board-grid .map-frame svg#map{inset:9px 1px 3px;width:calc(100% - 2px);height:calc(100% - 12px)}
.board-grid .map-frame #map>rect{display:none}
.board-grid .map-tools,.board-grid .locator,.board-grid .legend,.board-grid .scale{display:none}
.board-grid .map-controls{right:0;background:#081a42be;bottom:6px;border-color:#2773ae40;opacity:.64}
.board-grid .map-controls:hover{opacity:1}
.board-grid .map-controls button{width:26px;height:26px;background:transparent;border-color:#2773ae40}
.board-grid .admin-shape{fill:var(--city-fill);stroke:var(--city-stroke);stroke-width:.9;stroke-dasharray:2.2 1.3}
.board-grid .admin-shape.available{fill:#0a758d;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:none}
.board-grid .admin-shape:hover,.board-grid .admin-shape.focused{fill:color-mix(in srgb,var(--city-fill) 72%,var(--accent));stroke:var(--glow)}
.board-grid .admin-label{fill:#f6fbff;stroke:var(--city-fill);stroke-width:2.8;font-weight:700;font-size:14px}
.board-grid .admin-label.available{font-size:15.5px;stroke:#0a758d}
.board-grid .map-count{fill:#dff0ff;stroke:var(--city-fill);stroke-width:2.3;font-size:12px}
.map-beacon{cursor:pointer;filter:drop-shadow(0 0 5px #008ffe88)}
.map-beacon ellipse{fill:#0953b8;fill-opacity:.55;stroke:var(--glow);stroke-width:.75}
.map-beacon path{fill:url(#beacon-light);stroke:#12bbed;stroke-width:.55}
.board-grid .pin-group rect,.board-grid .pin-group circle{fill:#106b9b;stroke:var(--glow)}
.board-grid .place-label{fill:#c2deff;stroke:var(--screen-bottom)}
.board-grid .layer-pop{left:12px;top:31px;z-index:9}
.board-grid .board-ai-container{position:absolute;right:clamp(15px,1.15vw,24px);top:0;bottom:10px;width:calc((100% - 2 * clamp(15px,1.15vw,24px) - 2 * clamp(7px,.9vw,19px)) * .265);z-index:4;box-shadow:0 7px 32px #0009}
.board-ai-container .ai-panel{height:100%;border:1px solid var(--edge)}
.board-ai-container .ai-head{gap:8px}
.board-grid .board-region-picker{position:absolute;z-index:8;top:0;left:clamp(15px,1.15vw,24px);width:calc((100% - 2 * clamp(15px,1.15vw,24px) - 2 * clamp(7px,.9vw,19px)) * .265);max-height:76%;overflow:auto;background:var(--surface);border:1px solid var(--edge);box-shadow:0 6px 22px #000a;padding:9px}
.board-region-picker .row-between{gap:5px;display:flex;justify-content:space-between}
.board-region-picker .panel-head,.board-region-picker .panel-block{padding:8px;border-color:var(--border)}
.board-region-picker .panel-head h1{font-size:19px}
.board-region-picker label{display:grid;gap:4px;margin-bottom:7px}
.board-region-picker select{width:100%;min-height:30px}
.board-region-picker .list-item{min-height:28px}
.board-source{position:absolute;bottom:0;right:0;left:0;padding:0 4px;color:var(--muted);font-size:10px;pointer-events:none}
body[data-mode=overview] .status{background:transparent;border:0;padding-bottom:3px}
.board-card .warn,.ai-message,.login-card{border-radius:2px}
.login-card{background:var(--surface);border-color:var(--edge)}
.btn.primary{color:#031637}
@media(max-width:900px){
  .board-grid{gap:5px;padding-inline:8px}.board-nav{gap:5px;padding-inline:8px}
  .board-card{padding:7px 6px}.board-nav .left-nav,.board-nav .right-nav{gap:3px}
  .board-grid .board-region-picker,.board-grid .board-ai-container{width:34%;min-width:224px}
  .bar-axis{display:none}.bar-chart{grid-template-columns:3px minmax(0,1fr)}
  .h-row{grid-template-columns:3.1em minmax(0,1fr) auto}
  body[data-mode=overview] .shell{height:100vh;min-height:520px}
}
@media(max-width:620px){
  body[data-mode=overview] .shell{height:auto;min-height:100vh;grid-template-rows:60px auto auto 20px}
  .topnav .brand{font-size:16px;letter-spacing:.08em}.mast-slash,.mast-accents{display:none}
  .topnav .top-actions{top:0;right:4px;line-height:1}
  .board-nav{grid-template-columns:1fr;gap:4px;padding-top:5px;padding-bottom:5px}
  .board-nav .right-nav{grid-column:1}
  .board-grid{grid-template-columns:minmax(0,1fr);height:auto}
  .board-center{grid-row:1;grid-template-rows:66px minmax(290px,47vh);margin-top:0}
  .board-left,.board-right{grid-template-rows:none;gap:5px}
  .board-card{min-height:142px}
  .board-grid .board-region-picker{top:65px;width:calc(100% - 16px);left:8px;max-height:350px}
  .board-grid .board-ai-container{bottom:auto;top:66px;right:8px;width:calc(100% - 16px);height:min(490px,70vh)}
}

/* A · 原稿蓝。沿用共享大屏的几何布局，校准底色、仪表和地图。 */
body[data-variant="a"] {
  color-scheme: dark;
  --bg: #070e49;
  --surface: #031436;
  --fg: #f0f5ff;
  --muted: #a7bfdf;
  --border: #13598e;
  --accent: #55ebf6;
  --accent-soft: #103865;
  --map: #060f42;
  --water: #0c1c55;
  --project: #22bfd5;
  --parcel: #86acd9;
  --building: #edc36a;
  --plan: #a5a4fd;
  --selected: #8df1ff;
  --neighbor: #68baff;
  --warn: #ffdd88;
  --warn-bg: #393021;
  --chart: #3284de;
  --chart-a: #5a9cec;
  --chart-b: #1c67bf;
  --chart-track: #19477b;
  --chart-highlight: #61e9fb;
  --screen-top: #090f57;
  --screen-bottom: #060e37;
  --mast-glow: #1b50cf;
  --edge: #146dbc;
  --chart-line: #5b86b8;
  --chart-fill: #508ce2;
  --city-fill: #152f6a;
  --city-stroke: #a5c9ef;
  --side-nav: #1745a3;
  --glow: #1771ca;
  --shadow: 0 6px 20px #00092266;
  --radius: 0px;
}

body[data-variant="a"] .topnav {
  background: linear-gradient(180deg, #123d99 0%, #1546b5 32%, #143a9f 61%, #0a1b6e 100%);
  box-shadow: inset 0 2px #3974d8, inset 0 -2px #0c54a6;
}

body[data-variant="a"] .topnav .brand {
  color: #f8fbff;
  text-shadow: 1px 3px #18377d;
}

body[data-variant="a"] .board-nav button {
  border-color: #104fac;
  border-radius: 0;
  background: linear-gradient(180deg, #2457b2, #102584 54%, #0a125c);
  color: #9abfec;
}

body[data-variant="a"] .board-nav button:hover,
body[data-variant="a"] .board-nav button[aria-current="page"],
body[data-variant="a"] .board-nav button[aria-pressed="true"] {
  border-color: #2389cb;
  background: linear-gradient(180deg, #2b65c9, #133f9a 55%, #0b2178);
  color: #83f6ff;
  box-shadow: inset 0 -2px #187fd2;
}

body[data-variant="a"] .board-card {
  background: #031337;
  border: 1px solid #145a8f;
  border-radius: 0;
  box-shadow: inset 0 0 19px #0d65932b;
}

body[data-variant="a"] .board-card .panel-title {
  color: #f2f7ff;
  text-shadow: 0 1px #102754;
}

body[data-variant="a"] .board-kpi {
  border-radius: 0;
  background: linear-gradient(180deg, #0e2c65 0%, #0b2357 100%);
  border-bottom-color: #165396;
}

body[data-variant="a"] .board-kpi strong {
  color: #f5f9ff;
}

body[data-variant="a"] .map-frame {
  background: var(--map);
  border-radius: 0;
}

body[data-variant="a"] .admin-shape {
  fill: #152f6a;
  stroke: #a5c9ef;
  stroke-opacity: .86;
}

body[data-variant="a"] .admin-shape.available,
body[data-variant="a"] .admin-shape.focused {
  fill: #0c718c;
  stroke: #42dcea;
  stroke-opacity: 1;
}

body[data-variant="a"] .admin-shape:not(.available):not(.focused):hover {
  fill: #244a87;
  stroke: #ebf8ff;
}

body[data-variant="a"] .admin-label,
body[data-variant="a"] .place-label,
body[data-variant="a"] .project-label,
body[data-variant="a"] .scope-label {
  stroke: #102759;
}

body[data-variant="a"] .admin-label.available {
  fill: #f0fcff;
}

body[data-variant="a"] .pin-group rect,
body[data-variant="a"] .pin-group circle {
  fill: #115eaa;
  stroke: #71eaff;
}

body[data-variant="a"] .pin-group text {
  fill: #f4fbff;
}

body[data-variant="a"] .feature.project {
  fill: #05a9cc58;
}

body[data-variant="a"] .ai-panel,
body[data-variant="a"] .drawer {
  border-color: #246a9e;
}

body[data-variant="a"] .ai-head,
body[data-variant="a"] .drawer-head {
  background: #0e2860;
}

body[data-variant="a"] .ai-message {
  background: #0b2251;
}

body[data-variant="a"] .ai-message.user {
  background: #15406e;
}

body[data-variant="a"] .btn.primary,
body[data-variant="a"] .btn.primary:hover {
  color: #042147;
  background: #6de5fb;
  border-color: #6de5fb;
}

body[data-variant="a"] .toast {
  color: #061a39;
}

body[data-variant="a"] .login-screen {
  background: radial-gradient(ellipse at 50% 35%, #183e87, #070e49 63%, #040d34);
}

body[data-variant="a"] .login-card {
  background: #081943;
  border: 1px solid #246a9e;
  border-radius: 4px;
}

body[data-variant="a"] dialog {
  background: var(--surface);
}
.a-missing {
  align-self: start;
  margin-top: 7px;
  padding: 7px 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
  border-left: 2px solid var(--edge);
}
.a-scope-trail {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 5px;
  color: var(--fg);
}
.a-data-tag {
  align-self: center;
  color: var(--muted);
}
.a-chart-note {
  flex: none;
  font-size: 11px;
  color: var(--muted);
}
.a-coverage {
  margin-top: 19px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}
.a-coverage h3 { color: var(--fg); margin-bottom: 5px; }
.a-coverage .btn { min-height: 28px; margin-top: 9px; font-size: 12px; }
.a-result-meta,.a-unlocated {
  display: block;
  margin-top: 2px;
}
#a-workspace-chooser {
  width: min(460px,calc(100vw - 28px));
  background: var(--surface);
  border-color: var(--edge);
}
#a-workspace-chooser label {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
}
#a-workspace-results {
  max-height: 230px;
  margin-block: 10px;
  overflow: auto;
}
#a-workspace-results .btn {
  height: auto;
  white-space: normal;
}
.board-grid .a-peek-shape { fill: var(--project); fill-opacity: .46; stroke-width: 1; }
.board-grid .a-peek-shape:is(:hover,:focus-visible,.is-chosen) { fill-opacity: 1; stroke: var(--selected); }

body[data-variant="a"] #app.shell {
  grid-template-rows: clamp(60px,8.9vh,105px) clamp(62px,10.7vh,122px) minmax(0,1fr) 19px;
  background: linear-gradient(176deg,var(--screen-top),var(--screen-bottom) 66%,var(--screen-top));
}
body[data-variant="a"] #main-nav,
body[data-variant="a"] .workspace-head { display:none }
body[data-variant="a"] .workspace { display:block; position:relative; min-height:0; height:100% }
body[data-variant="a"] .status { background:transparent;border:0 }
.detail-grid {
  display:grid;
  grid-template-columns: minmax(165px,20.2%) minmax(0,1fr) minmax(245px,27%);
  gap:clamp(10px,2.18vw,38px);
  width:100%; height:100%; min-height:0;
  padding:0 clamp(15px,1.7vw,31px) 11px;
}
.detail-rail {
  min-width:0; min-height:0; padding:1px; overflow:hidden;
  background:linear-gradient(155deg,var(--edge),#2063ab22 37%,#14d9ff8a 91%);
  clip-path:polygon(0 17px,17px 0,calc(100% - 17px) 0,100% 17px,100% 100%,0 100%);
}
.detail-rail .inspector {
  height:100%; overflow:auto; padding:13px 12px;
  border:0; background:linear-gradient(160deg,#081952,#070d32 94%);
  clip-path:polygon(0 17px,17px 0,calc(100% - 17px) 0,100% 17px,100% 100%,0 100%);
}
.detail-rail-title { padding:4px 3px 8px }
.detail-rail-title h1 { font-size:clamp(17px,1.27vw,24px); letter-spacing:0 }
.detail-rail-title p { color:var(--muted); font-size:11px; line-height:1.4; margin-top:3px }
.detail-block { margin:0 0 9px }
.detail-block h2 {
  font-size:13px; line-height:1.45; letter-spacing:0; margin:0 0 5px; padding:5px 8px;
  background:linear-gradient(90deg,#39879d,var(--accent-soft) 48%,transparent); color:#e5f3ff;
}
.detail-block label:not(.detail-layer-row label) {
  display:grid; gap:3px; margin:4px 0; color:var(--muted); font-size:11px;
}
.detail-rail .detail-block>.btn {
  display:flex; justify-content:flex-start; white-space:normal; width:100%;
  margin:4px 0; padding:4px 7px; min-height:28px; font-size:12px;
}
.detail-block .compact-select { width:100%; min-height:30px }
.detail-block .actions { margin-top:6px }
.detail-block .data-note { margin:4px 0 }
.detail-rail .list-item {
  min-height:28px; border-radius:1px; padding:4px 6px;
  border:1px solid #22619a38; margin:3px 0; background:#112b5b93;
}
.detail-rail .list-item:hover,.detail-rail .list-item.active { background:#144886 }
.detail-rail .list-item span { text-overflow:ellipsis; overflow:hidden; white-space:nowrap }
.detail-rail .list-item small { font-size:10px }
.detail-layer-row { display:flex; gap:4px; min-width:0; align-items:stretch; margin:4px 0; }
.detail-layer-row label {
  display:flex; align-items:center; gap:6px; flex:1; min-width:0; padding:4px 6px;
  background:linear-gradient(90deg,#153e6c,#0c1947); color:var(--fg); font-size:12px;
}
.detail-layer-row label input { margin:1px; accent-color:#0eabd0 }
.detail-layer-row label .swatch { flex:none }
.detail-count {
  flex:0 0 39px; min-width:0; text-align:center; background:#102654; color:var(--muted);
  border:1px solid var(--edge); font-size:10px; padding:2px;
}
.detail-count[aria-pressed="true"] { color:#e6fbff; border-color:#40dff0; background:#175381 }
.detail-main { min-width:0;min-height:0;display:grid;grid-template-rows:26px minmax(0,1fr);overflow:hidden }
.detail-main-head {
  display:flex; align-items:center; justify-content:space-between; gap:5px; padding:0 8px;
  background:linear-gradient(90deg,#12396a 0%,transparent 80%); border-bottom:1px solid var(--edge);
  font-size:12px; color:#d9ebff;
}
.detail-main-head span { text-overflow:ellipsis;overflow:hidden;white-space:nowrap }
.detail-main-content { min-width:0;min-height:0;position:relative; }
.detail-main-content .detail-map {
  position:absolute;inset:0;width:100%;height:100%;min-height:0; overflow:hidden;
  border:1px solid var(--edge); background:var(--map); box-shadow:inset 0 0 22px #0e77bb29;
}
.detail-main-content .detail-map .map-tools { top:7px;left:7px }
body[data-page="layers"] .detail-map .map-tools,
body[data-page="region"] .detail-map .map-tools { display:none }
body[data-page="region"] .detail-map .screen-meta { top:5px }
.detail-map .legend,.detail-map .locator,.detail-map .scale,.detail-map .map-controls {
  border:1px solid var(--edge);background:#0a214ce8;box-shadow:none;
}
.detail-map .map-controls { right:9px;bottom:39px; }
.detail-map .legend,.detail-map .scale { bottom:8px }
.detail-main-content .module-page {
  height:100%;padding:14px;overflow:auto;min-width:0;border:1px solid var(--edge);
  background:linear-gradient(165deg,#071944,#071437);
}
.detail-main-content .module-page>h2 { font-size:clamp(19px,2vw,27px); margin-bottom:8px;color:#9aeafa; }
.detail-main-content .module-cards { margin-top:9px }
.detail-main-content .module-page .detail-block { margin-top:11px }
.detail-right {
  min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1.16fr) minmax(0,1fr);
  gap:clamp(7px,1.2vh,13px);padding-top:26px;
}
.detail-summary, .detail-analysis {
  min-width:0;min-height:0;overflow:auto; background:linear-gradient(180deg,#061a47,#071641 96%);
  border:1px solid var(--edge); box-shadow:inset 0 0 18px #2494f330;
}
.detail-summary { padding:10px 12px; }
.detail-summary .panel-title { margin-bottom:7px; }
.detail-summary>h3 {
  color:#57ecf2;font-size:clamp(16px,1.44vw,25px);line-height:1.27;overflow-wrap:anywhere;
}
.detail-summary .detail-context { font-size:11px; margin:4px 0;color:var(--muted) }
.detail-summary .data-note { margin:4px 0 }
.detail-indicators { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 5px;margin:7px 0 8px }
.detail-indicators>div { min-width:0;display:grid;text-align:center;justify-items:center;gap:2px;--disk:#30d8dd }
.detail-indicators>div:nth-child(3n+2) { --disk:#66aef2 }
.detail-indicators>div:nth-child(3n+3) { --disk:#e5c77e }
.detail-indicators>div strong { max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:color-mix(in srgb,var(--disk) 55%,#fff);font-size:12px }
.detail-indicators>div>span {
  position:relative;width:clamp(31px,69%,85px);height:14px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--disk) 70%,transparent);
  background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--disk) 72%,transparent),color-mix(in srgb,var(--disk) 30%,transparent));
  box-shadow:0 3px 0 color-mix(in srgb,var(--disk) 46%,transparent),0 5px 0 color-mix(in srgb,var(--disk) 32%,transparent),0 0 10px color-mix(in srgb,var(--disk) 44%,transparent);
  margin:2px 0 4px;
}
.detail-indicators small { font-size:10px;color:#c0d4f2;line-height:1.22 }
.detail-table-links { display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 }
.detail-summary .btn { font-size:11px;min-height:26px;padding:3px 6px }
.detail-summary .panel-head,.detail-summary .panel-block { padding:5px 0 }
.detail-summary .panel-head h1,.detail-summary .panel-head h2 { font-size:18px; }
.detail-analysis { overflow:hidden; }
.detail-analysis .ai-panel { height:100%;border:0;background:transparent; }
.detail-analysis .ai-head { padding:6px 8px; }
.detail-analysis .ai-head h2 { font-size:13px; color:#e7f6ff; }
.detail-analysis .ai-head h2::before { content:"▸";color:var(--glow);margin-right:5px; }
.detail-analysis .ai-context,.detail-analysis .ai-feed,.detail-analysis .ai-prompts,.detail-analysis .ai-compose { padding:5px 7px; }
.detail-analysis .ai-compose textarea { min-height:31px; }
.detail-analysis .ai-message { padding:6px; }
@media(max-width:1090px) {
  .detail-grid { grid-template-columns:minmax(149px,21%) minmax(0,1fr) minmax(217px,27%);gap:10px;padding-inline:9px; }
  .detail-rail .inspector{padding-inline:7px}
}
@media(max-width:760px) {
  body[data-variant="a"] #app.shell { height:auto;min-height:100vh;grid-template-rows:60px auto auto 20px; }
  .detail-grid { grid-template-columns:minmax(0,1fr);height:auto; }
  .detail-main { grid-row:1;min-height:49vh }
  .detail-right { padding-top:0;grid-template-rows:auto minmax(300px,39vh) }
  .detail-rail .inspector { max-height:47vh }
  .detail-summary{overflow:visible}
}

</style>
</head>

  const {key,id,draft}=state.editor
  const next={}
  for(const [field,val] of Object.entries(draft)) {
    if (numeric.has(field) && val !== '') {
      if (!Number.isFinite(Number(val)) || Number(val)<0) {
        toast(field+'须为大于或等于 0 的数字')
        return false
      }
      next[field]=Number(val)
    } else next[field]=val.trim()||null
  }
  if (Object.hasOwn(next,meta[key].name) && next[meta[key].name]===null) {
    toast(meta[key].name+'不能为空')
    return false
  }
  edits[key]??={}
  edits[key][id]={...edits[key][id],...next}
  let persisted=true
  try{localStorage.setItem(storageKey,JSON.stringify(edits))}catch{persisted=false}
  state.editor=null

function handle(act,val,key) {
  switch (act) {
    case 'province': return go(()=>{state.level='province';resetNavigation()})
    case 'city': return go(()=>toCity(val))
    case 'district': return go(()=>switchDistrict(state.district===val?'all':val))
    case 'area': return go(toArea)
    case 'layers': state.layersOpen=!state.layersOpen;renderMap();return
    case 'fit': state.zoom=1;state.ox=state.oy=0;renderMap();return
    case 'zoom-in': case 'zoom-out':
      state.zoom=Math.min(7,Math.max(.55,state.zoom*(act==='zoom-in'?1.23:1/1.23)))
      renderMap()
      return
    case 'feature': case 'map-feature': case 'table-row': return go(()=>{
      state.study=null
      selectFeature(key,val)
      if (state.table) {
        if (state.tableLayer!==key) state.tablePage=0
        state.tableLayer=key
        showSelectedPage()
      }
      if (act==='table-row') {
        if(state.tableMax) state.tableMax=false
        moveToFeature(activeFeature())
      }
      $('inspector').scrollTop=0
    })
    case 'overview': return go(()=>{state.selected=state.anchor=state.study=null;$('inspector').scrollTop=0})
    case 'table-open': return go(()=>showTable(state.selected?.key??state.active))
    case 'table-layer': return go(()=>showTable(val))
    case 'table-close': return go(()=>{state.table=state.tableMax=false})
    case 'table-max': state.tableMax=!state.tableMax;$('drawer').classList.toggle('max',state.tableMax);return
    case 'next-page': return go(()=>{state.tablePage+=1})
    case 'prev-page': return go(()=>{state.tablePage=Math.max(0,state.tablePage-1)})
    case 'edit-row':
      if(state.selected) {
        state.editor={...state.selected,draft:{}}
        renderTable()
        $('drawer').querySelector('tr.selected input')?.focus({preventScroll:true})
      }
      return
    case 'cancel-edit': state.editor=null;renderTable();return
    case 'save-edit': if(commitEdit()) render();return
    case 'keep-edit': state.pending=null;$('change-dialog').close();return
    case 'discard-navigate': case 'save-navigate':
      if(act==='save-navigate'&&!commitEdit()) return
      state.editor=null
      $('change-dialog').close()
      state.pending?.()
      state.pending=null
      render()
      return
    case 'study': return go(openStudy)
    case 'end-study':
      Object.assign(state,state.study.viewport)
      state.study=null
      render()
      return
    case 'fit-study': {
      const f=nearby()
      const radius=state.study.km*data.area.pixelsPerKm
      state.zoom=Math.min(4,Math.max(.18,300/radius))
      state.ox=(500-f.at[0])*state.zoom
      state.oy=(360-f.at[1])*state.zoom
      renderMap()
      return
    }
    case 'radius': state.study.km=Number(val);render();return
    case 'study-tab': state.study.tab=val;state.study.highlight=null;render();return
    case 'study-sample': state.study.highlight=val;render();return
  }
}

let drag=null, suppress=false
map.addEventListener('pointerdown',event=>{
  if (event.button!==0) return
  drag={pointer:event.pointerId,x:event.clientX,y:event.clientY,ox:state.ox,oy:state.oy,moved:false}
})
map.addEventListener('pointermove',event=>{
  if(drag?.pointer!==event.pointerId) return
  const dx=event.clientX-drag.x, dy=event.clientY-drag.y
  if(!drag.moved && Math.hypot(dx,dy)<5) return
  if(!drag.moved) map.setPointerCapture(event.pointerId)
  const ratio=map.getScreenCTM()?.a||1
  drag.moved=true
  state.ox=drag.ox+dx/ratio
  state.oy=drag.oy+dy/ratio
  updateMapTransform()
})
function release(event) {
  if(drag?.pointer!==event.pointerId) return
  if(drag.moved) {suppress=true;setTimeout(()=>{suppress=false},0)}
  drag=null
}
map.addEventListener('pointerup',release)
map.addEventListener('pointercancel',release)
map.addEventListener('click',event=>{if(suppress)event.stopPropagation()},true)
map.addEventListener('wheel',event=>{
  event.preventDefault()
  const matrix=map.getScreenCTM()
  if(!matrix) return
  const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse())
  const zoom=Math.min(7,Math.max(.55,state.zoom*(event.deltaY<0?1.13:1/1.13)))
  const k=zoom/state.zoom
  state.ox=point.x-500-k*(point.x-500-state.ox)
  state.oy=point.y-360-k*(point.y-360-state.oy)
  state.zoom=zoom
  updateMapTransform()
},{passive:false})

function projected(geom) {
  const input=geom?.type==='Polygon'?[geom.coordinates]:geom?.type==='MultiPolygon'?geom.coordinates:null
  if(!Array.isArray(input)||!input.length)throw Error('只接受带面的 WGS84 GeoJSON。')
  const [lon,lat]=data.area.origin
  const cos=Math.cos(lat*Math.PI/180), scale=data.area.pixelsPerKm*111
  const points=[]
  const path=input.flatMap(part=>part.map(ring=>{
    if(!Array.isArray(ring)||ring.length<4)throw Error('多边形环至少需要四个坐标。')
    return 'M'+ring.map(([x,y])=>{
      if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(x-lon)>.6||Math.abs(y-lat)>.6)throw Error('公开演示以经纬度 (0, 0) 为虚构原点，请使用其附近的示例面。')
      const pp=[+(500+(x-lon)*cos*scale).toFixed(1),+(360-(y-lat)*scale).toFixed(1)]
      points.push(pp)
      return pp.join(',')
    }).join('L')+'Z'
  })).join('')
  const xx=points.map(p=>p[0]), yy=points.map(p=>p[1])
  const box=[Math.min(...xx),Math.min(...yy),Math.max(...xx),Math.max(...yy)]
  return {path,box,at:[(box[0]+box[2])/2,(box[1]+box[3])/2]}
}

    <div class="h-track" aria-hidden="true"><div class="h-fill" style="--w:${(v??0)/max*100}%"></div></div><strong>${v??'—'}</strong></div>`).join('')}</div>`
}
function typeChart(rows) {
  const sum=rows.reduce((n,r)=>n+r[1],0)
  const palette=['#2381fa','#00ddfa','#8069ff','#ffd45a']
  let start=0
  const stops=rows.map((r,i)=>{
    const finish=start+r[1]/Math.max(1,sum)*100
    const str=`${palette[i]} ${start}% ${finish}%`
    start=finish
    return str
  }).join(',')
  return `<div class="board-chart donut-chart"><div class="donut" style="--ring:${sum?'conic-gradient('+stops+')':'#163b76'}"><strong>${sum||'—'}</strong></div>
    <div class="donut-key">${rows.map(([k,v],i)=>`<div><i style="--segment:${palette[i]}"></i><span>${escape(k)}</span><strong>${v||'—'}</strong></div>`).join('')}</div></div>`
}

projected = geom => {
  const rings=geom?.type==='Polygon'?geom.coordinates:
    geom?.type==='MultiPolygon'&&Array.isArray(geom.coordinates)?geom.coordinates.flat(1):[]
  if(!Array.isArray(rings)||!rings.length||!rings.every(r=>Array.isArray(r)&&r.length>=4&&
    Array.isArray(r[0])&&Array.isArray(r.at(-1))&&r[0][0]===r.at(-1)[0]&&r[0][1]===r.at(-1)[1]))
    throw Error('请提供使用闭合环的 WGS84 面图斑。')
  const projection=aOriginal.projected(geom)
  const outlines=[...data.area.path.matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)].map(p=>[+p[1],+p[2]])
  const xx=outlines.map(p=>p[0]), yy=outlines.map(p=>p[1])
  const [left,top,right,bottom]=projection.box
  const tolerance=.1*data.area.pixelsPerKm
  if(right-left<.2||bottom-top<.2)throw Error('图斑范围过小，无法作为面录入。')
  if(left<Math.min(...xx)-tolerance||right>Math.max(...xx)+tolerance||
    top<Math.min(...yy)-tolerance||bottom>Math.max(...yy)+tolerance)
    throw Error('图斑超出演示片区样例工作范围。请先核对归属片区和坐标。')
  return projection
}

  drawNav()
  const rail=part('.detail-rail')
  if(detailNav.parentNode!==rail)rail.append(detailNav)
  detailNav.hidden=false
  const menus={region:regionMenu,layers:layerMenu,edit:editMenu,resources:resourceMenu,scenes:sceneMenu,query:queryMenu}
  detailNav.innerHTML=menus[pageId()]()
  const center=part('.detail-main-content')
  const crumb=pageId()==='region'?aRegion():mapPage()?'示例甲市 / 示例西区 / 演示片区':namesByPage[pageId()]
  part('.detail-main-head').innerHTML=`<span>${escape(crumb)}</span>${mapPage()?'<small>地图视口</small>':''}`
  if(mapPage()){
    bodyPage.hidden=true
    if(frame.parentNode!==center)center.append(frame)
    frame.hidden=false
    frame.classList.add('detail-map')
    renderMap()
    if(ui.mode==='edit')updateSearch()
  }else{
    frame.hidden=true
    if(bodyPage.parentNode!==center)center.append(bodyPage)
    bodyPage.hidden=false
    bodyPage.innerHTML=centerMarkup()
  }
  infoBox().innerHTML=`<div class="panel-title">基本概况</div>${summaryMarkup()}`
  const analysis=part('.detail-analysis')
  if(aiPane.parentNode!==analysis)analysis.append(aiPane)
  $('ai-panel').querySelector('.ai-head h2').textContent='项目智能分析'
  $('status-text').textContent=pageId()==='region'?aRegion()+' · '+layerStatus():
    mapPage()?'演示片区样例 · 虚构示意':'样例工作台 · '+namesByPage[pageId()]
  renderTable()
  renderAI()
}
render = () => {
  if(pageId()==='overview'){
    document.body.dataset.page='overview'
    restoreDash()
    $('ai-panel').querySelector('.ai-head h2').textContent='AI 问答'
    priorPage.render()
  } else mountDetails()
}
context = () => {
  if(pageId()==='query'&&detail.queryContext)return detail.queryContext
  if(pageId()==='layers'){
    const f=activeFeature()
    return {label:'图层管理 / 演示片区'+(f?' / '+f.id:''),id:f?.id,layer:state.selected?.key,
      rows:data.layers.project.length,area:true}
  }
  return priorPage.context()
}
renderAI = () => {
  priorPage.renderAI()
  if(pageId()==='query'&&!bodyPage.hidden)bodyPage.innerHTML=centerMarkup()
}
renderTable = () => {
  priorPage.renderTable()
  if(pageId()==='layers'&&!$('drawer').hidden)$('drawer').querySelector('[data-action=edit-row]')?.remove()
}

handle = (cmd,value,key) => {
  if(cmd==='detail-page'||cmd==='module'||cmd==='board-ai'||cmd==='board-region'){
    const next=cmd==='board-ai'?'query':cmd==='board-region'?'region':value
    if(next==='edit'&&!canEdit())return
    if(next==='edit'&&!ui.workspace&&ui.mode!=='edit'){
      priorPage.handle('module','edit')
      return
    }
    if(Object.hasOwn(namesByPage,next)||next==='overview'){
      go(()=>movePage(next))
      if(next==='query')$('ai-input').focus()
      return
    }
  }
  if(cmd==='city'||cmd==='district'||cmd==='peek-area'||cmd==='peek-project'){
    if(ui.mode==='overview')detail.regional=true
  }
  if(cmd==='province'&&ui.mode==='overview')detail.regional=false
  if(cmd==='switch-role'){
    detail.regional=false
    detail.layers=null
    detail.queryContext=null
  }
  if(cmd==='scene')ui.toolbox=null
  if(cmd==='detail-target-layer'){
    go(()=>{state.active=value;state.visible[value]=true})
    return
  }
  if(cmd==='detail-layer-table'||(ui.mode==='layers'&&(cmd==='table-open'||cmd==='table-layer'))){
    go(()=>showTable(value||state.active))
    return
  }
  if(ui.mode==='layers'&&cmd==='edit-row')return
  if(cmd==='detail-study'&&activeFeature()&&canEdit()){
    const target={...state.selected}
    go(()=>{
      savePage()
      goEdit('area')
      selectFeature(target.key,target.id)
      openStudy()
    })
    return
  }
  if(cmd==='a-answer-target'&&ui.mode==='layers'){
    const [purpose,layer,id]=value.split('|')
    if(purpose==='table'&&index[layer]?.has(id)){
      go(()=>{selectFeature(layer,id);showTable(layer)})
      return
    }
  }
  if(cmd==='a-answer-target'&&ui.mode!=='edit')savePage()
  if(cmd==='enter-area'&&ui.mode==='layers')savePage()
  priorPage.handle(cmd,value,key)
}
document.addEventListener('input',event=>{
  if(event.target.matches('[data-outline]')){
    detail.outline=event.target.checked
    renderMap()
  }
  if(ui.mode==='layers'&&event.target.matches('[data-visible]')){
    state.visible[event.target.dataset.visible]=event.target.checked
    render()
  }
})
document.addEventListener('change',event=>{
  const t=event.target
  if(t.id==='detail-city')handle(t.value?'city':'province',t.value)
  if(t.id==='detail-district')handle(t.value?'district':'board-above',t.value)
  if(t.id==='detail-active')handle('detail-target-layer',t.value)
})

</script>
</body>
</html>
